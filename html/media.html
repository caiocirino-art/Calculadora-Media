<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de média</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    
<div class="container">

    <h1>Calculadora de média</h1>
    <p class="sub">Sistema de notas do aluno</p>

    <div id="formulario">

        <label>Nome do aluno:</label>
        <input type="text" id="nome" placeholder="Digite o nome do aluno" required>

        <label>Nome da Disciplina:</label>
        <br>
        <select id="disciplina" required>
            <option value="">Selecione a Disciplina</option>
            <option value="FDD">Fundamentos do Design Digital</option>
            <option value="FTDI">Fotografia Digital</option>
            <option value="PRAAI">Projetos de Áudio e Vídeo</option>
        </select>
        <br>
        <br>
        <div class="notas">

            <div>
                <label>1° Bimestre</label>
                <input type="number" id="nota1" placeholder="Digite a nota" required>
            </div>
            <div>
                <label>2° Bimestre</label>
                <input type="number" id="nota2" placeholder="Digite a nota" required>
            </div> 
            <div>
                <label>3° Bimestre</label>
                <input type="number" id="nota3" placeholder="Digite a nota" required>
            </div>    
            <div>    
                <label>4° Bimestre</label>
                <input type="number" id="nota4" placeholder="Digite a nota" required>
            </div>    

        </div>

        <br>

        <button id="calcular" onclick="CalculaMedia()"> Calcular Média </button>
        <button id="calcularNovo" onclick="calcularNovo()"> Calcular Novamente </button>
        
        <a href="" id="link">Calculadora Normal</a>

    </div>

    <div id="resultado" class="resultado">

    <p>Preencha os dados acima e clique em calcular média</p>

    </div>

</div>







    <script src="../js/calcular-media.js"></script>
</body>
</html>
